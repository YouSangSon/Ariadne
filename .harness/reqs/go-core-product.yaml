audit:
  must_not_implement:
    - Go launcher, 실제 프로세스와 signal 및 cancel adapter, CLI 또는 기본 런타임 전환
    - Context, Evaluation, Wiki, Memory, Code의 내부 구현 및 데이터나 module 저장
    - G1b 소유 파일과 외부 계약 또는 글로벌 설정 및 credential 변경
  completion_report_should_include:
    - 소스 commit 및 tree, 소유 파일 hash와 검사 명령 및 종료 상태
    - TDD 실패와 통과 근거, cleanup, main 통합과 CI의 남은 gate
    - verified는 이 단위의 로컬 검증만 뜻하며 원격 CI와 게시 및 제품 런타임 전환은 별도다.
