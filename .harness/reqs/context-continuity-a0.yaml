schema_version: 1
kind: harness.requirement

metadata:
  req_id: context-continuity-a0
  title: A0 컨텍스트 팩의 확정 사실과 검증 계약 보존
  status: verified
  priority: P0
  owner: Codex
  intake_started: 2026-11-02
  promoted_at: 2026-11-02
  source_doc: docs/unified-execution-design.md §10, A0

source:
  raw_user_prompt: |
    Goal real behavior: preserve requirement.confirmed_facts + verification commands/gate/escalate_after/attempts/evidence references as mandatory context before optional notes; fail with empty stdout if mandatory over budget; scrub before truncation; validate filename slug vs metadata.req_id and four known statuses, unknown/missing status must reject (explicit verified permitted, automatic excludes verified).
  user_language: ko
  repo: ariadne

classification:
  category: fix
  confidence: high
  reason: 승인된 A0 설계의 컨텍스트 계약만 구현한다.

requirement:
  user_intent: 다음 세션이 확정 사실과 검증 계약을 잃지 않고 작업을 이어 간다.
  actor: 컨텍스트 팩을 읽는 에이전트
  desired_outcome: 필수 정보는 온전히 보존하고 잘못된 REQ와 예산 초과는 팩 없이 거절한다.
  confirmed_facts:
    - 기존 5섹션, UTF-16 예산, scrub 함수와 2칸 들여쓰기 mapping reader를 재사용한다.
    - 부모의 modules/loop/contract.mjs가 기존 fieldBlock 함수를 재사용하므로 같은 시그니처를 export한다.
    - 별도 공통 reader 파일과 일반 YAML parser는 추가하지 않는다.
  assumptions: []

functional_contract:
  acceptance_criteria:
    - id: AC1
      priority: P0
      statement: confirmed_facts와 verification의 commands, gate, escalate_after, attempts, evidence를 긴 선택 노트보다 먼저 절단 없이 보존한다.
      verification: node --test tests/context-pack.test.mjs
      passes: true
    - id: AC2
      priority: P0
      statement: 필수 정보가 예산을 넘으면 CLI는 실패하고 stdout은 비어 있으며 시크릿은 절단 전에 scrub한다.
      verification: node --test tests/context-pack.test.mjs
      passes: true
    - id: AC3
      priority: P0
      statement: 파일명과 metadata.req_id 불일치 및 누락, 알 수 없거나 누락한 status를 거절하고 명시한 verified만 선택한다.
      verification: node --test tests/context-pack.test.mjs
      passes: true
    - id: AC4
      priority: P0
      statement: 기존 mapping 오류 경계와 팩 계약을 보존하고 context 원본과 두 생성 미러가 일치하며 저장소 verify가 통과한다.
      verification: node scripts/verify.mjs
      passes: true

code_mapping:
  code_areas:
    context:
      paths: [lib/context-pack.mjs, tests/context-pack.test.mjs]
      reason: 필수 필드 보존과 REQ 경계 검증
    skill:
      paths: [skills/context/SKILL.md, .agents/skills/context/SKILL.md, .claude/skills/context/SKILL.md]
      reason: 현재 동작 문서와 context 미러만 재생성
  boundary_rules:
    - 지정 worktree와 위 소유 파일 및 이 REQ만 수정한다.
    - 외부 provider API 호출, 설정과 credential 변경, push와 merge를 하지 않는다.
    - 일반 YAML parser와 dependency를 추가하지 않는다.

verification:
  commands:
    - node --test tests/context-pack.test.mjs
    - node scripts/verify.mjs
  verify_gate_required: true
  verify_gate_reason: 기존 저장소 테스트와 생성 미러 계약을 함께 확인한다.
  escalate_after: 3
  attempts:
    - gate: context-contract
      failure_kind: verification
      blocker: 수정 전 27개 중 7개 회귀 테스트 실패, 별도 CLI 예산 초과 재현은 종료 0으로 잘못 통과했다.
      evidence: .harness/handoff/context-a0-20261102/failure-first.log, .harness/handoff/context-a0-20261102/failure-first-cli.log
      changed_input: 필수 필드 선정과 읽기 경계의 ID 및 상태 검증을 수정했다.
  evidence:
    - criterion_id: AC1
      check: node --test tests/context-pack.test.mjs
      result: passed
      exit_code: 0
      source_state: "base 4cdc6e1542af98475acc133de52717e18d7d5960; A0 code/test/skill/mirror sha256 f5918fbaf4a770e9fb214aaf53626b2bf0f31561587bd320e4da6f9957531edd"
      artifact: .harness/handoff/context-a0-20261102/focused-final.log
    - criterion_id: AC2
      check: node --test tests/context-pack.test.mjs
      result: passed
      exit_code: 0
      source_state: "base 4cdc6e1542af98475acc133de52717e18d7d5960; A0 code/test/skill/mirror sha256 f5918fbaf4a770e9fb214aaf53626b2bf0f31561587bd320e4da6f9957531edd"
      artifact: .harness/handoff/context-a0-20261102/focused-final.log
    - criterion_id: AC3
      check: node --test tests/context-pack.test.mjs
      result: passed
      exit_code: 0
      source_state: "base 4cdc6e1542af98475acc133de52717e18d7d5960; A0 code/test/skill/mirror sha256 f5918fbaf4a770e9fb214aaf53626b2bf0f31561587bd320e4da6f9957531edd"
      artifact: .harness/handoff/context-a0-20261102/focused-final.log
    - criterion_id: AC4
      check: node scripts/verify.mjs
      result: passed
      exit_code: 0
      source_state: "base 4cdc6e1542af98475acc133de52717e18d7d5960; A0 code/test/skill/mirror sha256 f5918fbaf4a770e9fb214aaf53626b2bf0f31561587bd320e4da6f9957531edd; REQ closure metadata excluded"
      artifact: .harness/handoff/context-a0-20261102/verify.log

audit:
  must_not_implement:
    - 실행기, model, install, adapt 및 다른 미러 변경
    - A1 이후 실행·재개 기능
  completion_report_should_include:
    - 커밋 SHA와 실패 재현 및 통과 명령, 종료 상태, 소스 상태, 근거 경로
    - 미확인 사항과 변경하지 않은 범위
