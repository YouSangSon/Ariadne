audit:
  must_not_implement:
    - 유료 모델 호출과 외부 서비스 변경
    - source runtime의 제품 전용 API·DB·SSE·승인 엔진
    - 기존 작업의 stage·commit 또는 되돌리기
  completion_report_should_include:
    - 적용한 원리와 보류 이유
    - 실제 실행한 로컬 검증과 미관측 CI·runtime·성능 범위
    - 작업 소유 커밋과 기존 변경 보존 여부
