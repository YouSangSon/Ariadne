    - node scripts/check-mirror.mjs
    - node scripts/verify.mjs
  verify_gate_required: true
  verify_gate_reason: 게이트와 세션 연속성 경계를 바꾸는 공통 하네스 변경이다
  escalate_after: 3
  evidence:
