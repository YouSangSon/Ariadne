  commands:
    - git diff --cached --check
    - node scripts/verify.mjs
  verify_gate_required: true
  verify_gate_reason: 최종 staged source를 기준으로 기존 전체 저장소 게이트를 한 번 확인한다
  escalate_after: 3
  evidence:
    - criterion_id: AC1
      check: "Parse canonical REQ; compare confirmed decisions, proposed defaults and existing source"
      result: passed
      exit_code: 0
      source_state: ".harness/handoff/super-agent-design-20261102/final-validation.json"
      artifact: ".harness/handoff/super-agent-design-20261102/design-checks.json"
    - criterion_id: AC2
      check: "Independent architecture review of single and pooled native/API execution contracts"
      result: passed
      exit_code: null
      source_state: ".harness/handoff/super-agent-design-20261102/final-validation.json"
      artifact: ".harness/handoff/super-agent-design-20261102/independent-review.json"
    - criterion_id: AC3
      check: "Independent review of control authority, lifecycle, revocation, unknown recovery and completion"
      result: passed
      exit_code: null
      source_state: ".harness/handoff/super-agent-design-20261102/final-validation.json"
      artifact: ".harness/handoff/super-agent-design-20261102/independent-review.json"
    - criterion_id: AC4
      check: "Verify 13 pinned Atlas source paths, 16 design sections, 12 local links and screenshot maintenance scope"
      result: passed
      exit_code: 0
      source_state: ".harness/handoff/super-agent-design-20261102/final-validation.json"
      artifact: ".harness/handoff/super-agent-design-20261102/design-checks.json"
    - criterion_id: AC5
      check: "node scripts/verify.mjs in isolated staged snapshot; compare all baseline and user image hashes"
      result: passed
      exit_code: 0
      source_state: ".harness/handoff/super-agent-design-20261102/final-validation.json"
      artifact: ".harness/handoff/super-agent-design-20261102/final-validation.json"
  attempts: []

audit:
  must_not_implement:
    - 실행 코드·DB·daemon·provider adapter·모델 설정·credential·글로벌 설치 변경
    - 유료 모델 호출·외부 게시·push·merge·배포
    - 기존 다른 작업의 파일 stage·커밋 또는 되돌리기
  completion_report_should_include:
    - 단일·복수 실행기의 사용 방식과 첫 구현 범위
    - 독립 설계 리뷰·문서·저장소 게이트의 검증 수준
    - 미검증 실제 실행·인증·과금·성능과 제안 기본값
