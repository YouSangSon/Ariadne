schema_version: 1
kind: harness.requirement

metadata:
  req_id: p2-generators
  title: P2 — 미러 생성기 + check-mirror + install/uninstall
  status: verified
  priority: P0
  owner: YouSangSon
  intake_started: 2026-07-20
  promoted_at: 2026-07-20
  source_doc: DESIGN.md §6 P2, §2.3 배포 단위, §5 팀 배포

source:
  raw_user_prompt: "계속해"
  user_language: ko
  repo: harness

classification:
  category: feature
  confidence: high
  reason: 설계 §6 P2가 범위와 완료 기준을 이미 규정 — P1 수동 미러(cp)를 생성기로 대체

requirement:
  user_intent: 스킬 미러·설치·검사를 수동 작업에서 멱등 스크립트로 바꿔 배포 가능 상태를 만든다
  actor: 하네스 개발자 + 설치하는 팀원
  desired_outcome: 생성→검사 왕복이 green이고, 설치·제거가 멱등하며, 클린 환경에서 self-check가 통과한다
  confirmed_facts:
    - P1 실측 — 미러 1행이 "---"가 아니면 양 CLI 로드 실패 (테스트 케이스 1호)
    - 서브에이전트 wrapper 생성 대상 0개 (§4.13.6 — 7개 전부 스킬)
    - 확장자는 .mjs 고정 (설치 후 주변 package.json type 불명 → 자기서술 확장자 필수)
  assumptions:
    - id: A1
      statement: 이 리포에 원격 CI가 없다 — "CI에서 self-check"는 로컬 클린 환경 시뮬레이션으로 대체
      confidence: high
      status: confirmed
      reason: git remote 없음. CI 편입은 리모트 생성 시점의 후속 작업으로 명시

functional_contract:
  acceptance_criteria:
    - id: AC1
      priority: P0
      statement: 생성기가 skills/ SSOT에서 .claude/.agents 미러를 만들고, 산출물 1행이 "---"이며 SSOT 해시 스탬프를 갖는다
      verification: "node scripts/generate-mirrors.mjs && head -1 .claude/skills/req-capture/SKILL.md == '---'"
      passes: true
    - id: AC2
      priority: P0
      statement: check-mirror가 드리프트(미러 변조)를 비정상 종료로 검출하고, 무드리프트면 0으로 종료한다
      verification: 테스트 — 변조 후 exit!=0, 재생성 후 exit==0
      passes: true
    - id: AC3
      priority: P0
      statement: install이 멱등하다 — 같은 prefix에 2회 실행 시 2회차는 전부 skipped, uninstall은 manifest 기재 파일만 제거한다
      verification: "node --test (tmp prefix 왕복 테스트)"
      passes: true
    - id: AC4
      priority: P0
      statement: 글로벌 설치본이 없는 클린 환경(빈 HOME)에서 check-mirror가 통과한다
      verification: "HOME=$(mktemp -d) node scripts/check-mirror.mjs → exit 0"
      passes: true
    - id: AC5
      priority: P1
      statement: core/AGENTS.core.md 150줄 캡 검사가 check-mirror에 포함된다
      verification: 캡 초과 시 exit!=0 테스트
      passes: true

code_mapping:
  code_areas:
    scripts:
      paths: [scripts/generate-mirrors.mjs, scripts/check-mirror.mjs, scripts/install.mjs, scripts/uninstall.mjs]
      reason: P2 산출물 본체
    tests:
      paths: [tests/generators.test.mjs]
      reason: 멱등성·드리프트·왕복 테스트 (node:test)
  boundary_rules:
    - 글로벌 설정(~/.claude, ~/.codex)을 수정하지 않는다 (D3) — install 기본 prefix는 ~/.harness, 포인터 주입은 미구현(사용자 확인 절차는 P6)
    - verify 게이트·훅 구현 금지 (P4 소관)
    - 서브에이전트 wrapper 생성기 구현 금지 (대상 0개 — 필요 시점에 추가)

verification:
  commands:
    - "node scripts/generate-mirrors.mjs && node scripts/check-mirror.mjs"
    - "node --test"
  verify_gate_required: false
  verify_gate_reason: verify 게이트는 P4에서 구축 — P2는 자체 테스트가 증거
  escalate_after: 3

audit:
  must_not_implement:
    - 글로벌 포인터 주입 (~/.claude/CLAUDE.md 수정 등 — P6에서 사용자 확인 절차와 함께)
    - adapt/context/verify-plan/handoff/retro 스킬 (P3~P5 소관)
    - CI 워크플로 파일 (리모트 없음 — 후속)
  notes:
    - "AC4 주의: asdf shim node는 빈 HOME에서 exit 126로 자체 실패 — 실바이너리(asdf which nodejs)로 검증. 테스트는 spawnSync env 상속이라 무영향"
  completion_report_should_include:
    - 테스트 실행 출력 (멱등성·드리프트 검출 증거)
    - 클린 환경 check-mirror 결과
