schema_version: 1
kind: harness.requirement

metadata:
  req_id: p6-deploy
  title: P6 — 배포 문서 (ONBOARDING/OPERATIONS 완성 + 모듈 문서) + 클린 설치 실측
  status: verified
  priority: P0
  owner: YouSangSon
  intake_started: 2026-07-20
  promoted_at: 2026-07-20
  source_doc: DESIGN.md §6 P6, §5, §4.9

source:
  raw_user_prompt: "harness P6 시작"
  user_language: ko
  repo: harness

classification:
  category: docs
  confidence: high
  reason: 로드맵 P6 행 = ONBOARDING/OPERATIONS + 모듈 문서. 단 글로벌 포인터 주입(코드)이 P5에서 P6로 이연되어 범위 확인 필요

clarification:
  next_question: ""
  options: []
  recommended_option: ""

requirement:
  user_intent: 신규 팀원이 문서만으로 설치→adapt→첫 REQ를 완주할 수 있게 배포 문서를 완성한다
  actor: 하네스를 처음 설치하는 팀원 (신규 머신)
  desired_outcome: 클린 환경에서 문서만 따라 첫 REQ 완주, 소요 시간이 문서에 실측 기재됨
  confirmed_facts:
    - docs/ONBOARDING.md(51행)·docs/OPERATIONS.md(93행) 스텁 존재 — P0/P1 실측 내용 포함, 설치 섹션은 "P2에서 제공 예정" 스텁 (실측)
    - install.mjs에 글로벌 포인터 주입 코드 없음 (실측 grep)
    - §5 OPERATIONS 요구 항목 중 미기재: 업데이트 전파, uninstall/eject, 시크릿 정책, 버전 스탬프
    - 모듈 문서 대상: modules/llm-wiki (구현 존재), akasha/parallax/telemetry 옵션 모듈 (§4.9 — 문서로만)
    - "사용자 확답 (2026-07-20): 글로벌 포인터 주입을 P6 범위에 포함 — install.mjs opt-in 주입"
  assumptions:
    - id: A1
      statement: "'신규 머신'은 격리 클린 환경(프레시 클론 + 격리 HOME)으로 대체 실측한다 — 물리적 신규 머신은 이 세션에서 불가"
      confidence: medium
      status: confirmed
      reason: 격리 HOME+프레시 클론에서 왕복 완주로 확인 (2026-07-20, 기계 시간 21초)
  rejected_assumptions: []

functional_contract:
  acceptance_criteria:
    - id: AC1
      priority: P0
      statement: ONBOARDING.md 설치 섹션이 실제 install 명령·adapt·첫 REQ 절차로 완성된다 (스텁 제거)
      verification: "grep -c '제공 예정' docs/ONBOARDING.md == 0 + 클린 환경에서 문서 명령 그대로 실행 성공"
      passes: true
    - id: AC2
      priority: P0
      statement: OPERATIONS.md에 §5 항목(업데이트 전파, uninstall/eject, 시크릿 정책, 버전) 기재
      verification: "문서 리뷰 — §5 각 항목에 대응하는 섹션 존재"
      passes: true
    - id: AC3
      priority: P0
      statement: 모듈 문서 — llm-wiki 사용 문서 + akasha/parallax/telemetry 옵션 모듈 요구사항·연결 방법 (§4.9, 문서만)
      verification: "modules/llm-wiki/README.md 존재 + 옵션 모듈 문서에 코드 변경 0"
      passes: true
    - id: AC4
      priority: P0
      statement: 클린 환경 왕복 실측 — 프레시 클론에서 문서만으로 install→adapt→첫 REQ 완주, 소요 시간을 ONBOARDING.md에 기재
      verification: "실측 로그 + ONBOARDING.md에 소요 시간 수치 존재"
      passes: true
    - id: AC5
      priority: P0
      statement: install.mjs opt-in 글로벌 포인터 주입 — 물어보고 진행(D3), 멱등, uninstall이 원상 복원
      verification: "node --test — 격리 HOME 픽스처에서 주입→재실행(변경 0)→uninstall(원상) assert"
      passes: true
    - id: AC6
      priority: P0
      statement: verify green 유지
      verification: "node --test && node scripts/verify.mjs"
      passes: true

code_mapping:
  code_areas:
    docs:
      paths: [docs/ONBOARDING.md, docs/OPERATIONS.md, modules/llm-wiki/README.md]
      reason: P6 본체
    scripts:
      paths: [scripts/install.mjs, scripts/uninstall.mjs]
      reason: opt-in 글로벌 포인터 주입 + uninstall 복원 (사용자 확답으로 범위 확정)
    tests:
      paths: [tests/install-pointer.test.mjs]
      reason: 격리 HOME 픽스처 왕복 테스트
  boundary_rules:
    - 이 머신의 실제 글로벌 설정(~/.claude, ~/.codex) 수정 금지 (D3) — 실측은 격리 HOME에서만
    - akasha/parallax 코드 수정 금지 (§7) — 문서로만 연결

verification:
  commands:
    - "node --test"
    - "node scripts/verify.mjs"
  verify_gate_required: true
  verify_gate_reason: P4 이후 REQ는 verify green이 종결 조건
  escalate_after: 3

audit:
  must_not_implement:
    - P7 루프 모듈, P8 평가 하네스
    - CI 벤더 종속 기능 (§7)
    - akasha/parallax 런타임 구현 — 문서만 (§4.9)
  completion_report_should_include:
    - 클린 환경 실측 로그와 소요 시간
    - 문서만으로 막힌 지점(있다면)과 문서 수정 내역
