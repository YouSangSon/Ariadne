schema_version: 1
kind: harness.requirement
metadata:
  req_id: ariadne-name-case
  title: GitHub·로컬 폴더·CLI의 제품 이름을 Ariadne로 통일
  status: ready_for_routing
requirement:
  user_intent: GitHub 저장소 이름과 로컬 폴더·CLI 이름을 Ariadne로 변경한다.
  desired_outcome: 제품 이름의 실제 대소문자를 일치시키고 연결 명령과 기존 사용자 데이터를 보존한다.
  confirmed_facts:
    - 제품의 CLI 명령과 루트 실행 파일은 Ariadne를 사용한다.
    - 기존 저장 형식·프로토콜 식별자·환경 변수와 보관 자료의 역사적 경로는 유지한다.
functional_contract:
  acceptance_criteria:
    - id: AC1
      statement: GitHub API와 파일시스템의 실제 저장소·폴더 이름은 Ariadne다.
    - id: AC2
      statement: package bin과 실행 파일·도움말·생성 명령·현재 문서는 Ariadne CLI를 참조한다.
    - id: AC3
      statement: 기존 사용자 변경·worktree·활성 연결·DB 식별자를 확인하고 이름 변경으로 데이터나 연결을 손상하지 않는다.
verification:
  commands:
    - node scripts/verify.mjs
    - GitHub 보호 설정·등록 소비자·활성 DB 및 Git 경로·상태 확인
audit:
  must_not_implement:
    - 원본 비공개 Git 이력 게시 또는 사용자 변경 덮어쓰기
    - 보관 DB의 추정 이관이나 기존 프로토콜 식별자 일괄 변경
    - 전역 설치 없이 전역 Ariadne 명령이 설치됐다고 보고
