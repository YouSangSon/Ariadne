schema_version: 1
kind: harness.requirement
metadata:
  req_id: extension-registry
  title: 실행하지 않는 확장 패키지 레지스트리 V1
  status: verified
requirement:
  user_intent: 승인한 Go와 Rust 확장 설계 구현을 계속하고 검증한 단위마다 커밋과 게시한다.
  desired_outcome: 실험 Go CLI에서 완성된 패키지를 실행 없이 설치하고 정확한 digest와 revision으로 선택 및 제거한다.
  confirmed_facts:
    - 선행 extension-runtime-qualification은 검증된 E0 시험 도구의 범위를 유지한다.
    - 현재 E1 요청은 선행 REQ의 공개 install 제외를 실험 Go CLI의 비실행 install에 한해 대체한다.
    - run과 사용자 code 실행 및 Node 제품 교체는 이번 단위에 포함하지 않는다.
classification:
  category: feature
functional_contract:
  acceptance_criteria:
    - id: AC1
      priority: P0
      statement: 허용 파일을 한 번씩 읽은 실제 bytes로 canonical manifest와 versioned digest를 만들고 원본을 다시 열지 않고 설치한다.
      verification: UTF-8 실패 재현과 독립 Python golden 및 파일 종류와 크기 및 원본 변경 검사를 통과한다.
      passes: true
    - id: AC2
      priority: P0
      statement: private SQLite가 checkout identity와 owner 및 exact schema를 검사하고 CAS와 단조 revision 및 선택 보존을 지킨다.
      verification: 독립 연결과 프로세스 CAS 및 ABA와 미래 schema 및 잘못된 root와 DB 검사를 통과한다.
      passes: true
    - id: AC3
      priority: P0
      statement: 설치 게시와 제거 의도의 crash를 복구하며 미등록 파일을 자동 실행하거나 삭제하지 않고 정리 실패를 남긴다.
      verification: staging과 publish 직후 및 제거 의도와 부분 삭제 subprocess crash 및 제거 경합과 취소 검사로 확인한다.
      passes: true
    - id: AC4
      priority: P0
      statement: 엄격한 비실행 CLI와 문서 및 소유권 map을 제공하고 기존 E0와 Node 계약 및 자원과 다른 작업을 보존한다.
      verification: 실제 CLI와 전체 Go race 및 vet와 AST 및 코어 gate와 Linux SQLite 통합 및 독립 리뷰와 소유 자원 정리를 대조한다.
      passes: true
code_mapping:
  boundary_rules:
    - driver와 SQL 및 filesystem은 Extensions adapter만 소유한다.
    - schema V1은 invocation과 runner가 없고 모든 결과는 runtimeQualified false다.
    - 앞으로 runner는 schema 2로 별도 구현하며 V1은 열린 handle에서도 이를 거절한다.
verification:
  verify_gate_required: true
audit:
  must_not_implement:
    - 사용자 run과 실행 권한 및 worker admission과 실행 회수 완료 선언
    - Node production 변경 및 기존 Memory와 Code DB 변경
    - credential과 Podman 기본 환경 변경 및 일괄 prune
