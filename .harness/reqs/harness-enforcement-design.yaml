audit:
  must_not_implement:
    - 중지된 runtime 구현과 실제 공급자/유료 API 실행
    - GitHub/Notion 게시 또는 보안/과금 설정 변경
    - 기존 verified REQ의 재인증과 사용자 변경의 포함
