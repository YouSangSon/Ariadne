schema_version: 1
kind: harness.requirement

metadata:
  req_id: unified-execution-policy
  title: Grilling 합의에 따른 통합 실행 정책·설계·인수 시나리오 동기화
  status: verified
  priority: P0
  owner: ""
  intake_started: 2026-11-02
  promoted_at: 2026-11-02
  source_doc: docs/execution-policy.md

source:
  raw_user_prompt: 추천대로 진행해 $policy-sync 이 스킬도 더 쓰고
  user_language: ko
  repo: ariadne

classification:
  category: docs
  confidence: high
  reason: 후속 grilling의 일곱 결정을 확정 정책과 기술 설계·시나리오에 반영한다

requirement:
  user_intent: 기존 통합 실행 설계의 제안 기본값과 운영 결정을 실제 합의한 정책으로 구체화한다
  actor: 하나 또는 여러 코딩 에이전트·모델 API를 쓰는 개인 개발자와 후속 구현자
  desired_outcome: 정책 정본·설계 책임·실패 시나리오·변경 이력·제품 적용 상태를 일관되게 찾을 수 있다
  confirmed_facts:
    - "UEP-01, 후속 Q1: 기존 도구 화면과 공통 CLI를 우선하고 API 단독 구성은 CLI를 사용한다. 웹 대시보드는 첫 범위에서 제외한다. 사용자가 추천대로 진행하라고 답했다"
    - "UEP-02, 후속 Q2: 첫 자동 실행은 맡긴 작업의 후속 처리이며 새 외부 이벤트는 관측한다. 새 작업 자동 시작은 프로젝트별 별도 활성화다. 사용자가 추천대로 진행하라고 답했다"
    - "UEP-03, 후속 Q3: 승인 예산 안에서 완료 품질을 우선하고 검증된 역할별 정책을 배정 근거로 삼는다. 사용자가 추천대로 진행하라고 답했다"
    - "UEP-04, 후속 Q4: 재시작 뒤 결과·소스·승인·예산을 확인한 작업만 자동 재개한다. 명시 중지·승인 대기·unknown은 유지한다. 사용자가 해당 추천을 명시 선택했다"
    - "UEP-05, 후속 Q5: 자동 배정 작업만 허용한 대체 실행기로 전환한다. 기존 실행 종료·효과 확인과 잔여 예산이 전제이며 명시 지정은 임의 변경하지 않는다. 사용자가 해당 추천을 명시 선택했다"
    - "UEP-06, 후속 Q6: 초기 동시 실행 상한은 2개이며 같은 작업 공간 writer는 1개다. 자식·검토·재시도도 공통 한도와 예산에 포함한다. 성능 측정값이 아닌 운영 기본값으로 사용자가 명시 선택했다"
    - "UEP-07, 후속 Q7: 작업 전체에 한 번 실행 범위와 예산을 승인하고 그 안의 구현·검토·재시도·전환은 추가 확인 없이 진행한다. 한도 초과·새 유료 경로·권한 확대는 중지 후 확인한다. 사용자가 추천대로 진행하라고 답했다"
    - policy-sync는 이번 정책 통합의 주 절차이며 이미 끝난 인터뷰를 반복하지 않는다
    - 위 합의는 목표 정책이며 실제 유료 실행·글로벌 설정 변경·자동 실행 활성화 승인이 아니다
    - 기존 unified-execution-design의 AC와 과거 검증 근거는 변경하지 않고 두 가정의 확인 상태와 후속 소유 관계만 갱신한다
  assumptions: []
  rejected_assumptions:
    - 짧은 추천 수락을 실제 모델 호출·외부 게시·권한 확대의 승인으로 취급한다
    - task 재시작·도구 전환·child 실행마다 새 예산을 부여한다
    - 같은 공급자의 더 큰 모델이나 더 비싼 모델이 검증 없이 더 높은 품질이라고 배정한다

functional_contract:
  acceptance_criteria:
    - id: AC1
      priority: P0
      statement: 일곱 확정 정책을 기존 허브에서 찾고 정상·거절·중단 상황의 결과를 본문만으로 판단할 수 있다
      verification: README·정책 목차·실제 헤딩과 독자 질문 대조
      passes: true
    - id: AC2
      priority: P0
      statement: 기존 제안·미확정 표기를 대체하고 정책 확정과 제품 미구현을 분리하며 실제 승인 범위를 넓히지 않는다
      verification: 기존 design REQ의 A1·A2와 새 정책·설계·변경 기록 의미 비교
      passes: true
    - id: AC3
      priority: P0
      statement: 자동 재개·failover·동시성·전체 예산의 책임과 예산 예약·unknown·child 처리 기대 결과를 구체화한다
      verification: 독립 설계 리뷰와 정책-설계-시나리오 추적 대조
      passes: true
    - id: AC4
      priority: P0
      statement: 기존 AC·과거 근거와 다른 작업의 변경·이미지를 보존하고 이번 소유 문서만 커밋한다
      verification: baseline hash·기존 AC·staged paths·전체 저장소 게이트와 정리 근거 확인
      passes: true

code_mapping:
  code_areas:
    policy:
      paths: [docs/execution-policy.md, docs/unified-execution-design.md, README.md]
      reason: 정책 정본과 기술 설계·시나리오·진입 링크를 연결한다
    decisions:
      paths: [.harness/reqs/unified-execution-policy.yaml, .harness/reqs/unified-execution-design.yaml, .harness/decisions.md]
      reason: 확정 근거·가정 확인·대체 범위를 기존 체계에 보존한다
  boundary_rules:
    - 기존 dirty decisions.md에는 소유한 한 줄만 append하고 해당 추가만 stage한다
    - 나머지 기존 미커밋·사용자 이미지는 수정·stage·삭제하지 않는다
    - 독자용 정책의 정본은 저장소이며 외부 게시본을 만들지 않는다
    - 구현·설치·migration·기존 데이터 보정은 수행하지 않는다

