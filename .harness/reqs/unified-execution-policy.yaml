    - git diff --cached --check
    - node scripts/verify.mjs
  verify_gate_required: true
  verify_gate_reason: 최종 staged tree에서 전체 게이트를 한 번 확인하고 새 정책의 문서·의미 검사를 별도로 수행한다
  escalate_after: 3
  evidence:
    - criterion_id: AC1
      check: "Validate policy decisions, navigation anchors and six reader questions"
      result: passed
      exit_code: 0
      source_state: ".harness/handoff/unified-policy-sync-20261102/final-validation.json"
      artifact: ".harness/handoff/unified-policy-sync-20261102/document-checks.json"
    - criterion_id: AC2
      check: "Compare old AC/evidence and confirmed assumptions; inspect target policy vs unimplemented runtime"
      result: passed
      exit_code: 0
      source_state: ".harness/handoff/unified-policy-sync-20261102/final-validation.json"
      artifact: ".harness/handoff/unified-policy-sync-20261102/document-checks.json"
    - criterion_id: AC3
      check: "Independent broad architecture review and focused parent-child writer-claim correction review"
      result: passed
      exit_code: null
      source_state: ".harness/handoff/unified-policy-sync-20261102/final-validation.json"
      artifact: ".harness/handoff/unified-policy-sync-20261102/independent-review.json"
    - criterion_id: AC4
      check: "node scripts/verify.mjs in isolated staged snapshot; compare baseline, owned append and commit scope"
      result: passed
      exit_code: 0
      source_state: ".harness/handoff/unified-policy-sync-20261102/final-validation.json"
      artifact: ".harness/handoff/unified-policy-sync-20261102/final-validation.json"
  attempts: []

audit:
  must_not_implement:
    - 실행기·API·DB·daemon·권한·credential·글로벌 설정·플러그인 변경
    - 유료 실행·외부 게시·push·merge·배포
    - 과거 verified AC의 변경·재인증 또는 다른 작업 파일의 커밋
  completion_report_should_include:
    - 확정 정책과 구현 차이·시나리오·후속 첫 작업
    - 실제 문서 검사·독립 리뷰·로컬 게이트와 미검증 런타임 범위
    - 보존·정리·소유 커밋
