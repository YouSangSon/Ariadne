name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 25
      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ github.workspace }}/.tool-versions
      - name: Check project Node version
        run: |
          project_node=$(awk '$1 == "nodejs" { print $2 }' "$GITHUB_WORKSPACE/.tool-versions")
          test "$(node --version)" = "v$project_node"
      - run: npm run setup
      - run: npm run verify
