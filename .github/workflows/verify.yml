name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 25
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.2'
      - run: node scripts/verify.mjs
