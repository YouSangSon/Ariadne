name: Native contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ github.workspace }}/.tool-versions
      - uses: actions/setup-python@v7
        with:
          python-version-file: ${{ github.workspace }}/.tool-versions
      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime/go/go.mod
          cache: false
      - name: Check experimental Go contracts and boundaries
        working-directory: runtime/go
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          GOCACHE: ${{ runner.temp }}/ariadne-native-cache
          GOTMPDIR: ${{ runner.temp }}/ariadne-native-tmp
          TMPDIR: ${{ runner.temp }}/ariadne-native-tmp
          GOPATH: ${{ runner.temp }}/ariadne-native-deps
          GOMODCACHE: ${{ runner.temp }}/ariadne-native-deps/pkg/mod
        run: |
          mkdir -p "$GOCACHE" "$GOTMPDIR" "$GOPATH"
          cleanup() {
            local check_exit=$?
            if go clean -modcache && rm -rf "$GOCACHE" "$GOTMPDIR" "$GOPATH" "$RUNNER_TEMP/ariadne-native-cli"; then
              exit "$check_exit"
            fi
            if [ "$check_exit" -ne 0 ]; then
              exit "$check_exit"
            fi
            exit 1
          }
          trap cleanup EXIT
          project_go=$(awk '$1 == "golang" { print $2 }' "$GITHUB_WORKSPACE/.tool-versions")
          test "$(go env GOVERSION)" = "go$project_go"
          go env GOVERSION GOOS GOARCH CGO_ENABLED
          project_node=$(awk '$1 == "nodejs" { print $2 }' "$GITHUB_WORKSPACE/.tool-versions")
          test "$(node --version)" = "v$project_node"
          project_python=$(awk '$1 == "python" { print $2 }' "$GITHUB_WORKSPACE/.tool-versions")
          test "$(python3 -B -c 'import platform; print(platform.python_version())')" = "$project_python"
          test -z "$(gofmt -l .)"
          go run ./cmd/check-architecture --root ../..
          go test -race ./...
          go vet ./...
          go build -o "$RUNNER_TEMP/ariadne-native-cli" ./cmd/Ariadne
          python3 -B ../../tools/qualify_context_files.py --go-cli "$RUNNER_TEMP/ariadne-native-cli" --scratch "$GOTMPDIR" --report "$RUNNER_TEMP/context-files-native.json"
      - name: Preserve native Context qualification proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: context-files-native
          path: ${{ runner.temp }}/context-files-native.json
          if-no-files-found: error
  extension-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - name: Install project Rust toolchain
        run: |
          project_rust=$(awk '$1 == "rust" { print $2 }' "$GITHUB_WORKSPACE/.tool-versions")
          test -n "$project_rust"
          rustup toolchain install "$project_rust" --profile minimal --component rustfmt --component clippy
          echo "RUSTUP_TOOLCHAIN=$project_rust" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version-file: ${{ github.workspace }}/.tool-versions
      - name: Check worker and qualification tooling
        env:
          CARGO_HOME: ${{ runner.temp }}/ariadne-extension-cargo
          CARGO_TARGET_DIR: ${{ runner.temp }}/ariadne-extension-target
        run: |
          test "$(rustc --version | awk '{ print $2 }')" = "$RUSTUP_TOOLCHAIN"
          project_python=$(awk '$1 == "python" { print $2 }' "$GITHUB_WORKSPACE/.tool-versions")
          test "$(python3 -B -c 'import platform; print(platform.python_version())')" = "$project_python"
          python3 --version
          cargo fmt --manifest-path runtime/rust/Cargo.toml --all -- --check
          cargo test --locked --manifest-path runtime/rust/Cargo.toml -p ariadne-compute
          cargo clippy --locked --manifest-path runtime/rust/Cargo.toml -p ariadne-compute --all-targets -- -D warnings
          cargo test --locked --manifest-path runtime/rust/Cargo.toml
          cargo test --locked --manifest-path runtime/rust/Cargo.toml --example qualification-os-probe
          cargo clippy --locked --manifest-path runtime/rust/Cargo.toml --all-targets -- -D warnings
          python3 -B tools/test_qualify_extension_runtime.py
      - name: Remove task-owned Cargo outputs
        if: always()
        run: rm -rf "$RUNNER_TEMP/ariadne-extension-cargo" "$RUNNER_TEMP/ariadne-extension-target"

  compute-process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime/go/go.mod
          cache: false
      - name: Install project Rust toolchain
        run: |
          project_rust=$(awk '$1 == "rust" { print $2 }' "$GITHUB_WORKSPACE/.tool-versions")
          test -n "$project_rust"
          rustup toolchain install "$project_rust" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$project_rust" >> "$GITHUB_ENV"
      - name: Compare actual Go adapter with compiled Rust engine
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          GOCACHE: ${{ runner.temp }}/ariadne-compute/go-cache
          GOTMPDIR: ${{ runner.temp }}/ariadne-compute/go-tmp
          GOPATH: ${{ runner.temp }}/ariadne-compute/go-deps
          GOMODCACHE: ${{ runner.temp }}/ariadne-compute/go-deps/pkg/mod
          CARGO_HOME: ${{ runner.temp }}/ariadne-compute/cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/ariadne-compute/cargo-target
          CARGO_BUILD_JOBS: 2
        run: |
          mkdir -p "$GOCACHE" "$GOTMPDIR" "$GOPATH"
          cleanup() {
            local check_exit=$?
            if (cd "$GITHUB_WORKSPACE/runtime/go" && go clean -modcache) && rm -rf "$RUNNER_TEMP/ariadne-compute"; then
              exit "$check_exit"
            fi
            if [ "$check_exit" -ne 0 ]; then exit "$check_exit"; fi
            exit 1
          }
          trap cleanup EXIT
          project_go=$(awk '$1 == "golang" { print $2 }' "$GITHUB_WORKSPACE/.tool-versions")
          test "$(go env GOVERSION)" = "go$project_go"
          go env GOVERSION GOOS GOARCH CGO_ENABLED
          test "$(rustc --version | awk '{ print $2 }')" = "$RUSTUP_TOOLCHAIN"
          cargo build --locked --manifest-path runtime/rust/Cargo.toml -p ariadne-compute --bin ariadne-compute
          export ARIADNE_COMPUTE_TEST_BINARY="$CARGO_TARGET_DIR/debug/ariadne-compute"
          cd runtime/go
          go test -count=1 -race -v ./internal/code/adapters/computeprocess
